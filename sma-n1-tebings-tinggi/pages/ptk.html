<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendidik dan Tenaga Kependidikan - SMA Negeri 1 Tebing Tinggi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#0d5c2e',secondary:'#1a7a3e',accent:'#f59e0b',dark:'#1e293b'},fontFamily:{sans:['Poppins','sans-serif']}}}}</script>
</head>
<body class="font-sans bg-gray-50 text-gray-800">
  <div id="site-header"></div>
  <main class="container mx-auto px-4 py-10">
    <nav class="text-sm text-gray-500 mb-6"><a href="../index.html" class="hover:text-primary">Beranda</a> / Profil / PTK</nav>
    <h1 class="text-3xl font-bold text-primary mb-2">Pendidik dan Tenaga Kependidikan</h1>
    <p class="text-gray-600 mb-6">Data berdasarkan Dapodik SMA Negeri 1 Tebing Tinggi</p>

    <div class="flex flex-wrap gap-3 mb-6">
      <button onclick="filterPTK('all')" class="filter-btn active px-4 py-2 rounded-lg bg-primary text-white text-sm">Semua</button>
      <button onclick="filterPTK('Guru')" class="filter-btn px-4 py-2 rounded-lg bg-white border text-sm hover:bg-green-50">Guru</button>
      <button onclick="filterPTK('Kepala Sekolah')" class="filter-btn px-4 py-2 rounded-lg bg-white border text-sm hover:bg-green-50">Kepala Sekolah</button>
      <button onclick="filterPTK('Tenaga Kependidikan')" class="filter-btn px-4 py-2 rounded-lg bg-white border text-sm hover:bg-green-50">Tenaga Kependidikan</button>
    </div>

    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-primary text-white">
            <tr>
              <th class="px-4 py-3 text-left">No</th>
              <th class="px-4 py-3 text-left">Nama</th>
              <th class="px-4 py-3 text-left">L/P</th>
              <th class="px-4 py-3 text-left">NIP</th>
              <th class="px-4 py-3 text-left">Jenis</th>
              <th class="px-4 py-3 text-left">Status</th>
            </tr>
          </thead>
          <tbody id="ptkTable" class="divide-y"></tbody>
        </table>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">* Data ditampilkan berdasarkan profil sekolah. Untuk update terbaru silakan melalui portal admin.</p>
  </main>
  <div id="site-footer"></div>
  <script src="../js/layout.js"></script>
  <script>
    initLayout('profil');
    let ptkData = [];
    async function loadPTK() {
      try {
        const res = await fetch('../data/ptk.json');
        ptkData = await res.json();
        renderTable(ptkData);
      } catch(e) {
        document.getElementById('ptkTable').innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">Gagal memuat data</td></tr>';
      }
    }
    function renderTable(data) {
      const tbody = document.getElementById('ptkTable');
      tbody.innerHTML = data.map((p, i) => `
        <tr class="hover:bg-green-50">
          <td class="px-4 py-3">${i+1}</td>
          <td class="px-4 py-3 font-medium">${p.nama}</td>
          <td class="px-4 py-3">${p.jk}</td>
          <td class="px-4 py-3 text-xs">${p.nip || '-'}</td>
          <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-xs ${p.jenis.includes('Kepala')?'bg-amber-100 text-amber-800':p.jenis==='Guru'?'bg-green-100 text-green-800':'bg-blue-100 text-blue-800'}">${p.jenis}</span></td>
          <td class="px-4 py-3 text-xs">${p.status}</td>
        </tr>
      `).join('');
    }
    function filterPTK(type) {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-primary','text-white');
        b.classList.add('bg-white','border');
      });
      event.target.classList.add('bg-primary','text-white');
      event.target.classList.remove('bg-white','border');
      if (type === 'all') renderTable(ptkData);
      else renderTable(ptkData.filter(p => p.jenis === type || (type==='Guru' && p.jenis.includes('Guru'))));
    }
    loadPTK();
  </script>
</body>
</html>
