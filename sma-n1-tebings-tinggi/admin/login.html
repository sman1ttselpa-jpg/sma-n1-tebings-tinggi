<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - SMA Negeri 1 Tebing Tinggi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#0d5c2e', secondary: '#1a7a3e', accent: '#f59e0b' },
          fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-gradient-to-br from-primary to-green-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <img src="../assets/logo.png" alt="Logo" class="h-20 mx-auto mb-3">
      <h1 class="text-2xl font-bold text-primary">Portal Admin</h1>
      <p class="text-gray-500 text-sm">SMA Negeri 1 Tebing Tinggi</p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-user"></i></span>
          <input type="text" id="username" required
            class="w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="Masukkan username">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" required
            class="w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="Masukkan password">
        </div>
      </div>
      <div id="errorMsg" class="hidden text-red-600 text-sm bg-red-50 p-3 rounded-lg"></div>
      <button type="submit"
        class="w-full bg-primary hover:bg-secondary text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">
      Sistem dilindungi enkripsi. Hanya untuk pengelola resmi sekolah.<br>
      <a href="../index.html" class="text-primary hover:underline mt-1 inline-block">← Kembali ke Website</a>
    </p>
  </div>

  <script>
    // Simple client-side auth for demo (in production use server-side + bcrypt/JWT + HTTPS)
    // Default: username = admin , password = admin123
    // Password is hashed with SHA-256 for basic protection in localStorage demo
    async function hashPassword(pw) {
      const encoder = new TextEncoder();
      const data = encoder.encode(pw);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      // Hardcoded credentials (change in production!)
      const VALID_USER = 'admin';
      const VALID_HASH = await hashPassword('admin123'); // precomputed equivalent

      const inputHash = await hashPassword(password);

      if (username === VALID_USER && inputHash === VALID_HASH) {
        // Store session (demo - use httpOnly cookie + JWT in production)
        const session = {
          user: username,
          loginAt: new Date().toISOString(),
          token: btoa(username + ':' + Date.now()) // simple token
        };
        sessionStorage.setItem('adminSession', JSON.stringify(session));
        // Log activity
        const logs = JSON.parse(localStorage.getItem('activityLogs') || '[]');
        logs.unshift({ action: 'Login berhasil', user: username, time: new Date().toLocaleString('id-ID') });
        localStorage.setItem('activityLogs', JSON.stringify(logs.slice(0, 100)));
        window.location.href = 'dashboard.html';
      } else {
        errorMsg.textContent = 'Username atau password salah!';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
